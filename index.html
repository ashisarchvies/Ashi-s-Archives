<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ashi's Archives</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

header{
padding:60px;
}

h1{
font-size:55px;
margin:0;
}

p{
color:#bbb;
font-size:20px;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:30px;

padding:40px;

max-width:1200px;

margin:auto;

}

.card{

background:#222;

padding:20px;

border-radius:15px;

transition:.3s;

}

.card:hover{

transform:scale(1.03);

background:#333;

}

img{

width:100%;

border-radius:10px;

}

footer{

padding:40px;

color:#777;

}

</style>

</head>

<body>

<header>

<h1>Ashi's Archives</h1>

<p>Preserving Rare Thai Music Media</p>

</header>

<div class="grid">

<div class="card">

<h2>Springy</h2>

<p>Album Collection</p>

</div>

<div class="card">

<h2>Tatar</h2>

<p>CD / VCD / Cassette</p>

</div>

<div class="card">

<h2>Coming Soon</h2>

<p>More Archives...</p>

</div>

</div>

<footer>

© Ashi's Archives

</footer>

</body>

</html>
